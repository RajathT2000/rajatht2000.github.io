# nginx site for the portfolio on the droplet.
# Installed by deploy/setup.sh as /etc/nginx/sites-available/portfolio (DOMAIN is filled in).
# Static files come straight from the git checkout; /api/ goes to the Node server (server/server.js).
# Only whitelisted files are public: source, tests, .env and .git are never served.

limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/portfolio;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ ^/(favicon\.svg|favicon-32\.png|apple-touch-icon\.png)$ { expires 7d; }
    location ~ ^/(vendor|cv|audio)/[\w.-]+\.(js|css|pdf|mp3|m4a)$ { expires 1h; }

    location /api/ {
        limit_req zone=portfolio_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # everything else (server/, tests/, .env, .git, CLAUDE.md, ...) is not public
    location / { return 404; }
}
